[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typeinspection"
version = "0.6.0"
description = "Get class names and fully qualified names of Python classes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Juan Luis Casanova", email = "juanluiscr27@hotmail.com" }
]
keywords = ["type", "inspection", "class", "names"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mypy>=1.19.1",
    "ruff>=0.15.4",
]

[project.optional-dependencies]
testing = [
    "pytest==9.0.2",
    "wheel==0.46.3",
    "setuptools==80.10.2",
]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.urls]
Homepage = "https://github.com/juanluiscr27"

[tool.hatch.build.targets.wheel]
packages = ["typeinspection"]

[tool.hatch.build.targets.sdist]
include = [
    "/typeinspection",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E", "W", # pycodestyle errors/warnings
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins shadowing
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
